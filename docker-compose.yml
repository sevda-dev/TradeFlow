services:

  frontend:
    image: node:22
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    command: npm run dev -- --host 0.0.0.0
    stdin_open: true
    tty: true

  backend:
    build: ./backend
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    depends_on:
      - db

  db:
    image: postgres:16
    environment:
      POSTGRES_DB: tradeflow
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres